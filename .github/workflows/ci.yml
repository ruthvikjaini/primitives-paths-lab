name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -q
      - name: Run demo
        run: PYTHONPATH=src python scripts/demo.py
      - name: Cross-foot README figures
        run: PYTHONPATH=src python scripts/crossfoot.py
